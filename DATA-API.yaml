# DATA-API 1.0. Replace the base URL with the public HTTPS address before submission.
# Do not put passwords, JWTs, MAX initData, or other secrets in this file.
schemaVersion: "1.0"

solution:
  name: "EventHub"

api:
  baseUrl: "https://api.example.org"
  defaultHeaders:
    Accept: "application/json"

checks:
  - id: "published-events"
    name: "Получение опубликованных мероприятий"
    method: "GET"
    path: "/api/events"
    role: "public"
    request:
      query:
        page: 1
        pageSize: 20
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["items", "page", "pageSize", "totalCount", "hasNextPage"]
      bodySchema:
        type: "object"
        required: ["items", "page", "pageSize", "totalCount", "hasNextPage"]
        properties:
          items:
            type: "array"
          page:
            type: "integer"
          pageSize:
            type: "integer"
          totalCount:
            type: "integer"
          hasNextPage:
            type: "boolean"
    timeoutMs: 5000
    repeatable: true

  - id: "tags"
    name: "Получение доступных тегов"
    method: "GET"
    path: "/api/tags"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: "array"
    timeoutMs: 5000
    repeatable: true
