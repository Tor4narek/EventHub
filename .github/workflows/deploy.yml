name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build deployment environment
        id: build_env
        env:
          ADMIN_DOMAIN: ${{ secrets.ADMIN_DOMAIN }}
          ADMIN_PORT: ${{ secrets.ADMIN_PORT }}
          ADMIN__PASSWORDHASH: ${{ secrets.ADMIN__PASSWORDHASH }}
          ADMIN__USERNAME: ${{ secrets.ADMIN__USERNAME }}
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
          API_PORT: ${{ secrets.API_PORT }}
          JWT__AUDIENCE: ${{ secrets.JWT__AUDIENCE }}
          JWT__ISSUER: ${{ secrets.JWT__ISSUER }}
          JWT__SIGNINGKEY: ${{ secrets.JWT__SIGNINGKEY }}
          MAX__APIBASEURL: ${{ secrets.MAX__APIBASEURL }}
          MAX__BOTTOKEN: ${{ secrets.MAX__BOTTOKEN }}
          MAX__WEBHOOKSECRET: ${{ secrets.MAX__WEBHOOKSECRET }}
          MINIO_API_PORT: ${{ secrets.MINIO_API_PORT }}
          MINIO_CONSOLE_PORT: ${{ secrets.MINIO_CONSOLE_PORT }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO__ACCESSKEY: ${{ secrets.MINIO__ACCESSKEY }}
          MINIO__BUCKETNAME: ${{ secrets.MINIO__BUCKETNAME }}
          MINIO__ENDPOINT: ${{ secrets.MINIO__ENDPOINT }}
          MINIO__PUBLICBASEURL: ${{ secrets.MINIO__PUBLICBASEURL }}
          MINIO__SECRETKEY: ${{ secrets.MINIO__SECRETKEY }}
          MINIO__USESSL: ${{ secrets.MINIO__USESSL }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          SWAGGER__ENABLED: ${{ secrets.SWAGGER__ENABLED }}
          WEBAPP_DOMAIN: ${{ secrets.WEBAPP_DOMAIN }}
          WEBAPP_PORT: ${{ secrets.WEBAPP_PORT }}
        run: python3 deploy/build-env.py

      - name: Prepare SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing GitHub secret: $key"
              exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check public DNS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          API_DOMAIN: ${{ steps.build_env.outputs.api_domain }}
          ADMIN_DOMAIN: ${{ steps.build_env.outputs.admin_domain }}
          WEBAPP_DOMAIN: ${{ steps.build_env.outputs.webapp_domain }}
        run: |
          python3 - <<'PY'
          import os
          import socket
          import sys

          target = os.environ["DEPLOY_HOST"]
          for key in ("API_DOMAIN", "ADMIN_DOMAIN", "WEBAPP_DOMAIN"):
              domain = os.environ[key]
              try:
                  addresses = {item[4][0] for item in socket.getaddrinfo(
                      domain, None, family=socket.AF_INET
                  )}
              except socket.gaierror:
                  addresses = set()
              if target not in addresses:
                  print(f"::error::{domain} does not resolve to the deployment IP yet.")
                  sys.exit(1)
          PY

      - name: Copy source to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /opt/eventhub/app'
          rsync -az --delete \
            --exclude '.git/' --exclude '.env' \
            --exclude 'node_modules/' --exclude 'dist/' \
            --exclude 'bin/' --exclude 'obj/' \
            -e "$SSH" ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/eventhub/app/"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            .env "$DEPLOY_USER@$DEPLOY_HOST:/opt/eventhub/app/.env"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'chmod 600 /opt/eventhub/app/.env'

      - name: Build and start all services
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /opt/eventhub/app && docker compose --profile production config --quiet && COMPOSE_PARALLEL_LIMIT=1 docker compose --profile production build && docker compose --profile production up -d --wait && docker compose --profile production ps'
