name: eventhub

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9500}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9501}:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./EventHubAPI
      dockerfile: EventHubAPI/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      ASPNETCORE_HTTP_PORTS: "${API_PORT:-8456}"
      Minio__Endpoint: minio:9000
    ports:
      - "127.0.0.1:${API_PORT:-8456}:${API_PORT:-8456}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  admin:
    build: ./EventHubAdmin
    restart: unless-stopped
    environment:
      API_PORT: ${API_PORT:-8456}
      NGINX_ENVSUBST_FILTER: ^API_PORT$
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8457}:80"
    depends_on:
      - api

  webapp:
    build: ./EventHubFrontend
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:${API_PORT:-8456}
      NGINX_ENVSUBST_FILTER: ^API_UPSTREAM$
    ports:
      - "127.0.0.1:${WEBAPP_PORT:-5174}:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2.10-alpine
    profiles:
      - production
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:-}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-}
      WEBAPP_DOMAIN: ${WEBAPP_DOMAIN:-}
      API_PORT: ${API_PORT:-8456}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - admin
      - webapp

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
